<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>순천시 청년 소상공인 초기성장 프로젝트 - 컨설팅 일정 스케줄러</title>
    <style>
        :root {
            --primary-color: #0f2c59;
            --secondary-color: #0056b3;
            --accent-color: #00b4d8;
            --holiday-color: #d90429;
            --saturday-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
            
            --status-planned: #0284c7;   /* 예정 */
            --status-progress: #d97706;  /* 진행 */
            --status-done: #16a34a;      /* 완료 */
            --status-hold: #64748b;      /* 보류 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 15px; }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        header { background: var(--primary-color); color: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header-title-box { cursor: pointer; user-select: none; }
        .header-title-box h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-title-box p { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

        .stats-container { display: flex; gap: 8px; width: 100%; justify-content: space-between; margin-top: 5px; }
        .stat-card { flex: 1; background: rgba(255, 255, 255, 0.12); padding: 8px 6px; border-radius: 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.15); }
        .stat-card .num { font-size: 1.05rem; font-weight: bold; color: var(--accent-color); }
        .stat-card .label { font-size: 0.68rem; opacity: 0.9; white-space: nowrap; }

        /* Admin Bar */
        .admin-bar { display: none; background: #fef2f2; border: 1px solid #fca5a5; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; justify-content: space-between; align-items: center; color: #991b1b; font-size: 0.82rem; font-weight: bold; flex-wrap: wrap; gap: 8px; }
        .admin-bar button { padding: 6px 12px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: bold; }

        /* Controls */
        .controls { background: var(--card-bg); padding: 12px 15px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border: 1px solid var(--border-color); }
        .search-filter { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
        input[type="text"], select { padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.88rem; outline: none; }
        
        .worker-box { display: flex; align-items: center; gap: 6px; background: #e0f2fe; padding: 4px 10px; border-radius: 6px; border: 1px solid #bae6fd; }
        .worker-box label { font-size: 0.8rem; font-weight: bold; color: #0369a1; white-space: nowrap; }
        .worker-box input { padding: 5px 8px; font-size: 0.82rem; width: 110px; border: 1px solid #7dd3fc; }

        .btn-action-group { display: flex; gap: 8px; }
        .btn { padding: 9px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-success { background: var(--status-done); color: white; }
        .btn-print { background: #0f172a; color: white; }
        .btn-secondary { background: #475569; color: white; }
        
        .btn-item-save { background: var(--secondary-color); color: white; padding: 10px 16px; font-weight: bold; font-size: 0.85rem; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 12px; }
        .btn-item-save:hover { background: #003d80; }

        /* Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--text-color); font-size: 0.85rem; text-align: center; }
        .tab-btn.active { background: var(--secondary-color); color: white; border-color: var(--secondary-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Calendar */
        .calendar-container { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header h2 { font-size: 1.15rem; color: var(--primary-color); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        
        .calendar-day-header { text-align: center; font-weight: bold; padding: 8px 4px; background: #f8fafc; border-radius: 6px; color: var(--primary-color); font-size: 0.82rem; }
        .calendar-day-header.sun { color: var(--holiday-color); }
        .calendar-day-header.sat { color: var(--saturday-color); }

        .calendar-day { height: 130px; border: 1px solid var(--border-color); border-radius: 6px; padding: 5px; background: #ffffff; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .calendar-day .date-num { font-weight: bold; font-size: 0.82rem; margin-bottom: 2px; position: sticky; top: 0; background: white; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
        .calendar-day.sun .date-num { color: var(--holiday-color); }
        .calendar-day.sat .date-num { color: var(--saturday-color); }
        .calendar-day.holiday .date-num { color: var(--holiday-color); }
        .holiday-label { font-size: 0.65rem; font-weight: normal; }

        .event-card { background: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 0.7rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #cbd5e1; border-left-width: 4px; flex-shrink: 0; }
        .event-card.status-예정 { border-left-color: var(--status-planned); background: #f0f9ff; }
        .event-card.status-진행 { border-left-color: var(--status-progress); background: #fffdf5; }
        .event-card.status-완료 { border-left-color: var(--status-done); background: #f0fdf4; }
        .event-card.status-보류 { border-left-color: var(--status-hold); background: #f8fafc; }
        
        .event-card .time { font-weight: 800; color: var(--primary-color); }
        .event-card .company { font-weight: 700; color: #0f172a; }
        .event-card .topic { font-size: 0.66rem; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

        .mobile-schedule-list { display: none; flex-direction: column; gap: 10px; }
        .mobile-date-group { background: white; border-radius: 8px; border: 1px solid var(--border-color); padding: 12px; }
        .mobile-date-header { font-weight: bold; font-size: 0.95rem; color: var(--primary-color); padding-bottom: 6px; border-bottom: 1px solid #f1f5f9; margin-bottom: 8px; display: flex; justify-content: space-between; }

        /* Accordion Card */
        .company-cards-list { display: flex; flex-direction: column; gap: 12px; }
        .accordion-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }

        .card-summary { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #ffffff; cursor: pointer; }
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .company-num { font-size: 1.0rem; font-weight: 800; color: var(--secondary-color); }
        .company-name-box h3 { font-size: 1.0rem; font-weight: 700; color: var(--primary-color); }
        .company-info-text { font-size: 0.78rem; color: #64748b; margin-top: 1px; }

        .summary-right { display: flex; align-items: center; gap: 6px; }
        .round-status-pill { font-size: 0.7rem; font-weight: 600; padding: 3px 6px; border-radius: 12px; background: #f1f5f9; }
        .toggle-btn { background: #f1f5f9; border: none; padding: 5px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: var(--secondary-color); }

        .card-detail { display: none; padding: 15px; background: #f8fafc; border-top: 1px solid var(--border-color); }
        .card-detail.open { display: block; }

        /* 소형 네이버 길찾기 링크 */
        .map-link-inline { display: inline-flex; align-items: center; gap: 3px; color: #15803d; text-decoration: none; font-weight: bold; font-size: 0.78rem; background: #dcfce7; padding: 2px 8px; border-radius: 4px; border: 1px solid #bbf7d0; margin-left: 6px; }
        .map-link-inline:hover { background: #bbf7d0; }

        .docs-input-box { background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 10px; }
        .docs-input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .docs-input-header label { font-size: 0.8rem; font-weight: bold; color: var(--primary-color); }
        .docs-status-select { font-size: 0.78rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        /* 기업 특성 / 성향 박스 */
        .traits-input-box { background: #fffbebf8; padding: 12px; border-radius: 8px; border: 1px solid #fef3c7; margin-top: 10px; }
        .traits-input-box label { font-size: 0.8rem; font-weight: bold; color: #b45309; display: block; margin-bottom: 4px; }

        .round-container { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .round-box { background: white; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .round-box.r1 { border-top: 3px solid var(--secondary-color); }
        .round-box.r2 { border-top: 3px solid var(--status-done); }
        .round-box h4 { font-size: 0.9rem; color: var(--primary-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .form-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: #475569; }
        .form-group input, .form-group select, .form-group textarea { font-size: 0.85rem; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; width: 100%; }
        .form-group textarea { resize: vertical; min-height: 55px; }

        .managers-double-box { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        /* Modal Overlay & Cards */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(3px); }
        .modal-card { background: white; width: 100%; max-width: 520px; border-radius: 16px; padding: 22px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 18px; right: 20px; font-size: 1.4rem; cursor: pointer; color: #94a3b8; font-weight: bold; }
        
        .modal-popup-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 15px; }
        .modal-popup-header h2 { font-size: 1.3rem; color: var(--primary-color); font-weight: 800; }
        .modal-status-badge { padding: 4px 12px; border-radius: 20px; color: white; font-weight: bold; font-size: 0.82rem; }

        .modal-topic-card { background: #f0f9ff; border-left: 4px solid var(--secondary-color); padding: 14px; border-radius: 0 8px 8px 0; margin-bottom: 14px; }
        .modal-topic-title { font-size: 0.78rem; font-weight: 800; color: var(--secondary-color); text-transform: uppercase; }
        .modal-topic-body { font-size: 1.0rem; font-weight: 700; color: #0f172a; margin-top: 4px; line-height: 1.4; }

        .modal-traits-card { background: #fffbebf8; border-left: 4px solid #f59e0b; padding: 12px; border-radius: 0 8px 8px 0; margin-bottom: 14px; font-size: 0.88rem; color: #78350f; }

        .modal-history-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        .modal-section-title { font-size: 0.82rem; font-weight: 800; color: var(--primary-color); margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        
        .history-timeline { display: flex; flex-direction: column; gap: 8px; }
        .history-step-item { background: white; padding: 10px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; }
        .history-step-item.active { border-color: var(--secondary-color); background: #f0f7ff; }

        .modal-contact-card { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        .contact-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.92rem; }
        .contact-phone-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--secondary-color); text-decoration: none; font-weight: bold; background: #e0f2fe; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }

        .history-list { max-height: 280px; overflow-y: auto; margin-top: 12px; border: 1px solid var(--border-color); border-radius: 8px; }
        .history-item { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; gap: 8px; }

        /* --- 🜂 A4 인쇄 전용 스타일 (@media print) --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 15mm;
            }
            body {
                background: white;
                color: black;
                padding: 0;
                font-size: 10pt;
            }
            header, .admin-bar, .controls, .tabs, .calendar-container, .modal-overlay, .toggle-btn, .btn-item-save, .map-link-inline {
                display: none !important;
            }
            .container {
                max-width: 100%;
                margin: 0;
            }
            .tab-content {
                display: block !important;
            }
            .company-cards-list {
                gap: 0;
            }
            
            /* 인쇄용 공문서/보고서 형태 레이아웃 */
            .accordion-card {
                border: none;
                border-bottom: 2px solid #000;
                border-radius: 0;
                page-break-inside: avoid;
                margin-bottom: 20px;
                padding-bottom: 15px;
            }
            .card-summary {
                padding: 0 0 10px 0;
                border-bottom: 1px solid #333;
            }
            .company-num { color: #000; font-size: 12pt; }
            .company-name-box h3 { font-size: 14pt; color: #000; }
            .company-info-text { font-size: 10pt; color: #222; }
            
            .card-detail {
                display: block !important;
                background: white;
                padding: 10px 0 0 0;
                border: none;
            }
            .docs-input-box, .traits-input-box {
                background: #f8fafc;
                border: 1px solid #ccc;
                padding: 8px;
                margin-top: 8px;
                font-size: 9pt;
            }
            .round-container {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 10px;
            }
            .round-box {
                border: 1px solid #666 !important;
                border-top: 2px solid #000 !important;
                padding: 8px;
                background: white;
            }
            .round-box h4 {
                font-size: 10pt;
                color: black;
                border-bottom: 1px solid #ccc;
                padding-bottom: 4px;
            }
            input, select, textarea {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-size: 9pt !important;
                color: black !important;
                appearance: none;
            }
            textarea {
                min-height: auto !important;
            }
            .print-report-header {
                display: block !important;
                text-align: center;
                border-bottom: 2px solid #000;
                padding-bottom: 12px;
                margin-bottom: 20px;
            }
            .print-report-header h1 {
                font-size: 18pt;
                color: #000;
            }
            .print-report-header p {
                font-size: 10pt;
                color: #555;
            }
        }

        .print-report-header { display: none; }

        /* Media Queries */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .stats-container { margin-top: 8px; }
            .btn { padding: 12px; font-size: 0.9rem; }
            .calendar-grid { display: none; }
            .mobile-schedule-list { display: flex; }
            .card-summary { padding: 10px 12px; }
            .summary-right { flex-direction: column; align-items: flex-end; gap: 2px; }
        }

        @media (min-width: 769px) {
            .stats-container { width: auto; }
            .search-filter { width: auto; }
            .btn { width: auto; }
            .round-container { grid-template-columns: 1fr 1fr; display: grid; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 인쇄 전용 공문서 헤더 -->
    <div class="print-report-header">
        <h1>순천시 청년 소상공인 초기성장 프로젝트 - 점포별 컨설팅 현황 보고서</h1>
        <p>발행일시: <span id="printDate">2026. 08. 04</span> | 총 10개 참여기업 관리 현황</p>
    </div>

    <!-- Header -->
    <header>
        <div class="header-title-box" onclick="handleHeaderClick()">
            <h1>순천시 청년 소상공인 초기성장 프로젝트</h1>
            <p>디자인 & 마케팅 공동 컨설팅 일정 스케줄러</p>
        </div>
        <div class="stats-container">
            <div class="stat-card">
                <div class="num" id="stat-total">10</div>
                <div class="label">전체 점포</div>
            </div>
            <div class="stat-card">
                <div class="num" id="stat-collected">0 / 10</div>
                <div class="label">자료수집 완료</div>
            </div>
            <div class="stat-card">
                <div class="num" id="stat-r1-done">0</div>
                <div class="label">1회차 완료</div>
            </div>
            <div class="stat-card">
                <div class="num" id="stat-r2-done">0</div>
                <div class="label">2회차 완료</div>
            </div>
        </div>
    </header>

    <!-- Admin Bar -->
    <div class="admin-bar" id="adminBar">
        <span>🔓 관리자 모드 (수정 이력 / 복원 권한 활성화됨)</span>
        <div>
            <button onclick="openHistoryModal()">📜 수정이력 & 되돌리기</button>
            <button onclick="exitAdminMode()" style="background:#475569; margin-left:4px;">종료</button>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="업소명 / 대표자 검색..." onkeyup="filterData()">
            <select id="categoryFilter" onchange="filterData()">
                <option value="">전체 분야</option>
                <option value="디자인">디자인</option>
                <option value="마케팅">마케팅</option>
                <option value="복합">복합</option>
                <option value="지원사업">지원사업</option>
            </select>
        </div>
        
        <div class="worker-box">
            <label>👤 작업자:</label>
            <input type="text" id="currentWorkerName" placeholder="작업자 성함" value="담당자" onchange="saveWorkerName()">
        </div>

        <div class="btn-action-group">
            <button class="btn btn-print" onclick="window.print()">🜂 현황 보고서 인쇄 (A4)</button>
            <button class="btn btn-success" onclick="saveAllData()">💾 전체 저장하기</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('calendar-view', this)">📅 월간 달력 스케줄러</button>
        <button class="tab-btn" onclick="switchTab('cards-view', this)">📋 업소별 상세 및 히스토리</button>
    </div>

    <!-- Tab 1: Calendar View -->
    <div id="calendar-view" class="tab-content active">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn btn-secondary" style="padding:6px 12px; width:auto;" onclick="changeMonth(-1)">◀ 이전달</button>
                <h2 id="calendarTitle">2026년 8월</h2>
                <button class="btn btn-secondary" style="padding:6px 12px; width:auto;" onclick="changeMonth(1)">다음달 ▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-header sun">일</div>
                <div class="calendar-day-header">월</div>
                <div class="calendar-day-header">화</div>
                <div class="calendar-day-header">수</div>
                <div class="calendar-day-header">목</div>
                <div class="calendar-day-header">금</div>
                <div class="calendar-day-header sat">토</div>
            </div>
            <div class="calendar-grid" id="calendarDays">
                <!-- PC Calendar JS -->
            </div>

            <div class="mobile-schedule-list" id="mobileScheduleList">
                <!-- Mobile Timeline JS -->
            </div>
        </div>
    </div>

    <!-- Tab 2: Company Cards List -->
    <div id="cards-view" class="tab-content">
        <div class="company-cards-list" id="companyCardsContainer">
            <!-- JS Cards Rendering -->
        </div>
    </div>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-card">
        <span class="modal-close" onclick="closeModal('infoModal')">&times;</span>
        <div class="modal-body" id="modalBody">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-card">
        <span class="modal-close" onclick="closeModal('historyModal')">&times;</span>
        <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">

    function filterData() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categoryFilter').value;

        const cards = document.querySelectorAll('.accordion-card');
        companies.forEach((item, index) => {
            const matchesSearch = item.name.toLowerCase().includes(search) || item.owner.toLowerCase().includes(search);
            const matchesCategory = category === "" || item.category === category;

            if (matchesSearch && matchesCategory) {
                cards[index].style.display = "";
            } else {
                cards[index].style.display = "none";
            }
        });
    }

        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    /* Render Calendar */
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        const pcGrid = document.getElementById('calendarDays');
        const mobileList = document.getElementById('mobileScheduleList');
        
        pcGrid.innerHTML = '';
        mobileList.innerHTML = '';

        for (let i = 0; i < firstDay; i++) {
            pcGrid.appendChild(document.createElement('div'));
        }

        let hasMobileEvents = false;

        for (let date = 1; date <= lastDate; date++) {
            const dayDiv = document.createElement('div');
            const dayOfWeek = new Date(year, month, date).getDay();
            
            const monthStr = String(month + 1).padStart(2, '0');
            const dateStrNum = String(date).padStart(2, '0');
            const dateStr = `${year}-${monthStr}-${dateStrNum}`;

            let dayClass = "calendar-day";
            let holidayName = "";

            if (dayOfWeek === 0) dayClass += " sun";
            if (dayOfWeek === 6) dayClass += " sat";
            if (koreanHolidays[dateStr]) {
                dayClass += " holiday";
                holidayName = `<span class="holiday-label">(${koreanHolidays[dateStr]})</span>`;
            }

            dayDiv.className = dayClass;
            dayDiv.innerHTML = `<div class="date-num"><span>${date}</span><span>${holidayName}</span></div>`;

            let dayEvents = [];

            companies.forEach(comp => {
                if (comp.r1Date && comp.r1Date.startsWith(dateStr)) {
                    dayEvents.push({ type: 1, comp: comp, date: comp.r1Date });
                }
                if (comp.r2Date && comp.r2Date.startsWith(dateStr)) {
                    dayEvents.push({ type: 2, comp: comp, date: comp.r2Date });
                }
            });

            dayEvents.forEach(ev => {
                const time = ev.date.split('T')[1] || '';
                const comp = ev.comp;
                const status = ev.type === 1 ? comp.r1Status : comp.r2Status;
                const content = ev.type === 1 ? comp.r1Content : comp.r2Content;

                const card = document.createElement('div');
                card.className = `event-card status-${status}`;
                card.onclick = () => openModal(comp, ev.type);
                card.innerHTML = `
                    <div><span class="time">${time}</span> <span class="company">${comp.name}</span> (${ev.type}회)</div>
                    <div class="topic">📌 ${content || '주제 미정'}</div>
                `;
                dayDiv.appendChild(card);
            });

            pcGrid.appendChild(dayDiv);

            if (dayEvents.length > 0) {
                hasMobileEvents = true;
                const mGroup = document.createElement('div');
                mGroup.className = 'mobile-date-group';
                
                let eventsHtml = '';
                dayEvents.forEach(ev => {
                    const time = ev.date.split('T')[1] || '';
                    const comp = ev.comp;
                    const status = ev.type === 1 ? comp.r1Status : comp.r2Status;
                    const content = ev.type === 1 ? comp.r1Content : comp.r2Content;

                    eventsHtml += `
                        <div class="event-card status-${status}" onclick="openModalById(${comp.id}, ${ev.type})" style="padding:10px; margin-top:6px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span class="time" style="font-size:0.85rem;">⏰ ${time}</span>
                                <span style="background:${getStatusColor(status)}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:0.7rem;">${status}</span>
                            </div>
                            <div style="font-size:0.95rem; font-weight:bold; margin-top:3px; color:var(--primary-color);">${comp.name} (${ev.type}회차 컨설팅)</div>
                            <div style="font-size:0.82rem; color:#334155; margin-top:4px;">📌 ${content || '등록된 수행 내용 없음'}</div>
                        </div>
                    `;
                });

                mGroup.innerHTML = `
                    <div class="mobile-date-header">
                        <span>📅 ${month + 1}월 ${date}일 (${['일','월','화','수','목','금','토'][dayOfWeek]})</span>
                        <span style="font-size:0.75rem; color:var(--holiday-color);">${koreanHolidays[dateStr] || ''}</span>
                    </div>
                    ${eventsHtml}
                `;
                mobileList.appendChild(mGroup);
            }
        }

        if (!hasMobileEvents) {
            mobileList.innerHTML = `<div style="padding:20px; text-align:center; color:#94a3b8; font-size:0.85rem;">이번 달에 등록된 컨설팅 일정이 없습니다.</div>`;
        }
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function openModalById(id, round) {
        const comp = companies.find(c => c.id === id);
        if (comp) openModal(comp, round);
    }

    /* 시인성 전면 개선 모달 팝업 */
    function openModal(comp, currentRound) {
        const modal = document.getElementById('infoModal');

        const status = currentRound === 1 ? comp.r1Status : comp.r2Status;
        const mgr1 = currentRound === 1 ? comp.r1Manager1 : comp.r2Manager1;
        const mgr2 = currentRound === 1 ? comp.r1Manager2 : comp.r2Manager2;
        const managersText = [mgr1, mgr2].filter(Boolean).join(', ') || '담당자 미정';

        const content = currentRound === 1 ? comp.r1Content : comp.r2Content;
        const dateTime = currentRound === 1 ? comp.r1Date : comp.r2Date;

        const encodedAddr = encodeURIComponent(comp.address);
        const naverMapUrl = `https://m.map.naver.com/search2/search.naver?query=${encodedAddr}`;
        const statusBg = getStatusColor(status);

        document.getElementById('modalBody').innerHTML = `
            <div class="modal-popup-header">
                <div>
                    <h2>${comp.name}</h2>
                    <span style="font-size:0.85rem; color:#64748b; font-weight:600;">${currentRound}회차 컨설팅 일정</span>
                </div>
                <span class="modal-status-badge" style="background:${statusBg};">${status}</span>
            </div>

            <!-- 핵심 컨설팅 수행 주제 -->
            <div class="modal-topic-card">
                <div class="modal-topic-title">📌 이번 회차 컨설팅 수행 주제 & 과제</div>
                <div class="modal-topic-body">${content || '등록된 수행 내용이 없습니다.'}</div>
                <div style="font-size:0.82rem; color:#64748b; margin-top:8px;">
                    ⏰ <strong>일시:</strong> ${dateTime ? dateTime.replace('T', ' ') : '일정 미정'} | 👥 <strong>담당:</strong> ${managersText}
                </div>
            </div>

            <!-- 기업 특성 및 사전 참고사항 카드가 있을 경우 표출 -->
            ${comp.traits ? `
            <div class="modal-traits-card">
                <strong>💡 기업 특성 및 사전 참고사항:</strong><br>
                ${comp.traits}
            </div>` : ''}

            <!-- 1회차 ↔ 2회차 연계 히스토리 -->
            <div class="modal-history-section">
                <div class="modal-section-title">🔄 1회차 ↔ 2회차 연계 컨설팅 히스토리</div>
                <div class="history-timeline">
                    <div class="history-step-item ${currentRound === 1 ? 'active' : ''}">
                        <strong>[1회차]</strong> ${comp.r1Date ? comp.r1Date.split('T')[0] : '미정'} (${comp.r1Status})<br>
                        <span style="color:#475569;">${comp.r1Content || '내용 없음'}</span>
                    </div>
                    <div class="history-step-item ${currentRound === 2 ? 'active' : ''}">
                        <strong>[2회차]</strong> ${comp.r2Date ? comp.r2Date.split('T')[0] : '미정'} (${comp.r2Status})<br>
                        <span style="color:#475569;">${comp.r2Content || '내용 없음'}</span>
                    </div>
                </div>
            </div>

            <!-- 대표자, 연락처, 주소 & 길찾기 소형 액션 -->
            <div class="modal-contact-card">
                <div class="contact-row">
                    <span><strong>대표자:</strong> ${comp.owner}</span>
                    <a href="tel:${comp.phone}" class="contact-phone-btn">📞 ${comp.phone} 전화걸기</a>
                </div>
                <div style="font-size:0.88rem; color:#334155; margin-top:6px; display:flex; align-items:center; justify-content:space-between;">
                    <span><strong>주소:</strong> ${comp.address}</span>
                    <a href="${naverMapUrl}" target="_blank" class="map-link-inline">📍 길찾기</a>
                </div>
            </div>
        `;

        modal.style.display = 'flex';
    }

    function openHistoryModal() {
        const modal = document.getElementById('historyModal');
        const container = document.getElementById('historyListContainer');
        container.innerHTML = '';

        if (historyStack.length === 0) {
            container.innerHTML = `<div style="padding:15px; text-align:center; color:#94a3b8;">기록된 변경 이력이 없습니다.</div>`;
        } else {
            historyStack.forEach((hist, idx) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div>
                        <strong>${hist.desc}</strong><br>
                        <small style="color:#64748b;">일시: ${hist.timestamp}</small>
                    </div>
                    <div class="history-btns">
                        <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.72rem; width:auto;" onclick="restoreHistory(${idx})">복원</button>
                        <button class="btn-del-hist" onclick="deleteHistoryItem(${idx})">삭제</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        modal.style.display = 'flex';
    }

    function deleteHistoryItem(idx) {
        if (confirm("이 히스토리 항목을 삭제하시겠습니까?")) {
            historyStack.splice(idx, 1);
            localStorage.setItem('suncheon_history_stack_v13', JSON.stringify(historyStack));
            openHistoryModal();
        }
    }

    function clearAllHistory() {
        if (confirm("모든 히스토리 내역을 비우시겠습니까? (이 작업은 되돌릴 수 없습니다.)")) {
            historyStack = [];
            localStorage.setItem('suncheon_history_stack_v13', JSON.stringify(historyStack));
            openHistoryModal();
        }
    }

    function restoreHistory(idx) {
        if (confirm(`'${historyStack[idx].desc}' 시점으로 데이터를 되돌리시겠습니까?`)) {
            companies = JSON.parse(JSON.stringify(historyStack[idx].data));
            autoSave();
            init();
            closeModal('historyModal');
            alert("데이터가 성공적으로 복원되었습니다.");
        }
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    window.onload = init;
</script>

</body>
</html>
